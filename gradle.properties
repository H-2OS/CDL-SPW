# 插件版本号。PF4J 的 ComparableVersion 不保证接受 `+` 元数据，只用 `-` 限定符。
version=0.0.0
# ★ 2026-10-18：由占位符 `CHANGE-ME` 换成真实仓库（用户给定）。
#   本值是**唯一真相源**，经 `processResources` 的 `expand` 进 `project.properties`
#   的 `source.url`，并写进 JAR manifest 的 `Plugin-Open-Source-Url`；
#   菜单「源仓库跳转」的可点性判据（`isPlaceholderSourceUrl`）读的也是它。
#   ⇒ 改这一行即可同时让菜单项**取消置灰**、关于对话框显示真地址、
#     宿主「开源地址」不再指向 404 —— **不要**再去别处写第二份。
projectUrl=https://github.com/H-2OS/CDL-SPW
kotlin.stdlib.default.dependency=false
# ── JVM 内存（2026-09-20）────────────────────────────────────────────────────
# 本机**提交限额（页面文件）偏紧**。默认堆 = 物理内存的 1/4，且 G1 会**一次性预留**
# 几百 MB 虚拟空间；Gradle 守护进程与 Kotlin 编译守护进程是**两个**进程，叠加起来
# 跑全量探针门禁时会把守护进程打死：
#   Caused by: java.net.SocketException: Connection reset
#   os::commit_memory(...) failed; error='页面文件太小' (DOS error/errno=1455)
# 症状是**探针一行输出都没有** —— 极易被误读成"探针被改坏了"（实际排查时确实被误导过）。
# 对策：**小堆 + SerialGC**（SerialGC 几乎不预留虚拟空间；本项目构建量小，用不上 G1）。
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dfile.encoding=UTF-8 -Djava.io.tmpdir=C:/Users/31866/AppData/Local/Temp
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Djava.io.tmpdir=C:/Users/31866/AppData/Local/Temp

# ── ⚠️ 2026-09-21：`-Djava.io.tmpdir` 是**必需的**，不是优化 ──────────────────
#
# ## 不加它会怎样
#
# Kotlin 编译器会为每个编译实例写一个标记文件，位置取自 `java.io.tmpdir` ——
# 而它在**本机（受限进程 / 沙箱）下会被解析成 `C:\WINDOWS`**（不可写），于是：
#
#   java.nio.file.AccessDeniedException:
#       C:\WINDOWS\kotlin-compiler-in-superislandforspw-….alive
#
# **编译直接失败，且报错信息与代码毫无关系** —— 极易被误判成"代码写错了"。
#
# ## 为什么写进本文件（而不是每次命令行传）
#
# 原先只在手动跑 `./gradlew` 时用 `-Dorg.gradle.jvmargs=… -Pkotlin.daemon.jvmargs=…` 传，
# 结果 **`tools/deploy.sh` 内部调 `gradlew.bat` 时没有这串参数 → 部署一跑就失败**。
# 写在这里之后，**脚本与所有手动命令都不再需要那串长参数**。
#
# ## 路径说明
#
# 用的是本机当前用户的 `%TEMP%`。它**只对本机开发环境有意义** ——
# 换机器部署时按需改成本机可写目录即可（留空或删掉这两处会退回系统默认行为）。
